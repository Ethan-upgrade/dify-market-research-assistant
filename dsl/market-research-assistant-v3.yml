    - data:
        desc: 把开始节点的分类选项拼成检索口径与写作口径两段文本，缺省时走通用口径
        selected: false
        title: ①ᵇ 归一调研范围
        type: code
        variables:
        - variable: market
          value_selector:
          - start
          - market_scope
        - variable: industry
          value_selector:
          - start
          - industry
        - variable: purpose
          value_selector:
          - start
          - research_purpose
        - variable: time_range
          value_selector:
          - start
          - time_range
        - variable: source_pref
          value_selector:
          - start
          - source_pref
        - variable: depth
          value_selector:
          - start
          - depth
        code_language: python3
        code: "DEFAULTS = {\n    \"market\": \"不限（全球为主）\",\n    \"industry\": \"不限\",\n    \"purpose\": \"竞品分析\",\n    \"time_range\": \"近三年\",\n    \"source_pref\": \"不限\",\n    \"depth\": \"3\",\n}\n\n# 数据源偏好 -> 检索时优先压进检索式的关键词 + 报告里的口径提醒\nSOURCE_HINT = {\n    \"优先券商研报/咨询报告\": (\"券商研报 行业报告\", \"优先采用券商研报 / 咨询机构口径，自媒体数据只能作旁证\"),\n    \"优先官方统计/政府数据\": (\"统计局 海关 官方数据\", \"优先采用官方统计与政策文件，商业机构口径需标注差异\"),\n    \"优先上市公司财报\": (\"财报 年报 分部收入\", \"优先采用上市公司财报与分部披露，估算值必须标注\"),\n    \"优先新闻报道\": (\"新闻报道 最新动态\", \"优先采用主流媒体近一年报道，注意去重与转载\"),\n    \"优先电商/社媒数据\": (\"电商 销量 评论 社媒\", \"优先采用电商销量与社媒口碑数据，注意平台口径差异\"),\n}\n\n\ndef main(market: str, industry: str, purpose: str, time_range: str, source_pref: str, depth: str) -> dict:\n    market = (market or \"\").strip() or DEFAULTS[\"market\"]\n    industry = (industry or \"\").strip() or DEFAULTS[\"industry\"]\n    purpose = (purpose or \"\").strip() or DEFAULTS[\"purpose\"]\n    time_range = (time_range or \"\").strip() or DEFAULTS[\"time_range\"]\n    source_pref = (source_pref or \"\").strip() or DEFAULTS[\"source_pref\"]\n\n    try:\n        rounds = int(str(depth).strip())\n    except Exception:\n        rounds = 3\n    rounds = min(4, max(2, rounds))\n\n    # 「不限」等于不加约束，不要往检索式里塞噪音\n    geo = \"\" if market.startswith(\"不限\") else market\n    src_kw, src_rule = SOURCE_HINT.get(source_pref, (\"\", \"\"))\n\n    search_lines = [\"【检索口径】\"]\n    search_lines.append(\"- 地区：\" + (\"不限，全球视角为主\" if not geo else geo))\n    search_lines.append(\"- 行业类型：\" + industry)\n    search_lines.append(\"- 时间范围：\" + (\"不限\" if time_range == \"不限\" else time_range + \"内发布的数据优先\"))\n    search_lines.append(\"- 调研目的：\" + purpose + \"（检索要覆盖支撑该目的的指标）\")\n    if src_kw:\n        search_lines.append(\"- 数据源偏好：\" + source_pref + \"（检索式里可带「\" + src_kw + \"」这类词）\")\n\n    report_lines = [\"【报告口径】\"]\n    report_lines.append(\"- 地区范围：\" + (\"全球为主，中国作为重点对照\" if not geo else geo))\n    report_lines.append(\"- 行业类型：\" + industry)\n    report_lines.append(\"- 时间口径：\" + (\"不限年份，按数据可得性\" if time_range == \"不限\" else time_range + \"为宜，更早的数据只在做趋势对比时引用\"))\n    report_lines.append(\"- 报告用途：\" + purpose + \"——结论与行动建议必须落到该用途上\")\n    if src_rule:\n        report_lines.append(\"- 数据源：\" + src_rule)\n\n    return {\n        \"search_scope\": \"\\n\".join(search_lines),\n        \"report_scope\": \"\\n\".join(report_lines),\n        \"geo\": geo or \"全球\",\n        \"purpose\": purpose,\n        \"time_range\": time_range,\n        \"rounds\": rounds,\n        \"summary\": \"地区=\" + market + \"｜行业=\" + industry + \"｜目的=\" + purpose\n                   + \"｜时间=\" + time_range + \"｜来源=\" + source_pref + \"｜轮数=\" + str(rounds),\n    }\n"
        outputs:
          search_scope:
            type: string
            children: null
          report_scope:
            type: string
            children: null
          geo:
            type: string
            children: null
          purpose:
            type: string
            children: null
          time_range:
            type: string
            children: null
          rounds:
            type: number
            children: null
          summary:
            type: string
            children: null
      height: 98
      id: code_scope
      position:
        x: 190
        y: 620
      positionAbsolute:
        x: 190
        y: 620
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 把一句话需求转成可执行简报，并预置两条初始检索式
        selected: false
        title: ① 调研需求解析
        type: llm
        model:
          provider: ''
          name: ''
          mode: chat
          completion_params:
            temperature: 0.3
            max_tokens: 4096
        prompt_template:
        - role: system
          text: '你是资深市场研究总监，负责把客户的一句话需求，转成一份可以直接执行的调研简报。


            ## 第一步：判断信息是否充分

            判定标准：必须同时明确「调研对象（行业 / 品类 / 公司 / 产品）」和「目标市场（国家或地区）」。

            如果本会话历史消息里已经出现过这些信息，直接沿用，不要重复追问。

            如果「已追问次数」已经 ≥ 2，即使信息仍然不完整，也不许再追问：直接按现有信息出简报，

            把推测出来的部分写在「待确认」里，并在最后一行注明「（基于假设继续）」。


            ## 第二步：按判断结果输出

            - 信息充分 → 第一行只写 <!--READY-->，从第二行开始输出简报。

            - 信息不充分且追问次数 < 2 → 第一行只写 <!--CLARIFY-->，第二行只写一句最关键的追问（一次只问一个问题，可给 2~3 个选项）。


            ## 信息充分时的简报格式（严格照抄字段名）

            调研主题：<一句话说清要研究什么>

            所属行业：<行业 / 品类>

            目标市场：<国家或地区>

            目标客群：<人群画像>

            调研目的：<这份报告支撑什么决策>

            时间范围：<需要的数据时效>

            核心问题：

            1. <问题一>

            2. <问题二>

            3. <问题三>

            4. <问题四>

            建议数据来源：<公开报告 / 财报 / 行业新闻 / 电商评论 / 政策文件 等>

            初始检索式1：<覆盖市场规模与增速的检索短句，带地区与年份>

            初始检索式2：<覆盖竞争格局或价格渠道的检索短句，带地区与年份>

            待确认：<用户没提到、但影响结论的关键假设；没有就写「无」>


            ## 约束

            - 全程简体中文，不编造事实。

            - 两条初始检索式要互不重复、8~30 字、能直接丢进搜索引擎，不要引号不要编号。

            - <!--READY--> / <!--CLARIFY--> 前后不要添加任何其他文字。

            - 用户已经用下拉框界定了调研范围（见下方「检索口径」）：地区、时间、数据源按它来，不要自己改；这部分不用再追问。'
        - role: user
          text: '用户需求：{{#sys.query#}}


            {{#code_scope.search_scope#}}


            已追问次数：{{#conversation.clarify_round#}}'
