    - data:
        desc: 读报告里的 <!--CITED--> 清单，只保留真正被引用的来源，同时剥干净标记
        selected: false
        title: ⑫ᵇ 按实际引用生成来源表
        type: code
        variables:
        - variable: text
          value_selector:
          - llm_report
          - text
        - variable: source_list
          value_selector:
          - code_sources
          - source_list
        code_language: python3
        code: "import re\n\n\ndef main(text: str, source_list: str) -> dict:\n    raw = (text or \"\").replace(\"\\r\", \"\")\n    body = raw\n\n    # 优先读报告末尾的「引用清单：1, 3, 12, K1」；解析不到就用正文里实际出现的编号兜底\n    cited = []\n    m = re.search(r\"^\\s*引用清单[:：]\\s*(.+)$\", raw, re.M)\n    if m:\n        cited = re.findall(r\"(K?[0-9]+)\", m.group(1))\n        body = (raw[: m.start()] + raw[m.end():]).strip()\n\n    # 顺手清掉模型偶尔仍会吐的 HTML 注释\n    body = re.sub(r\"<!--.*?-->\", \"\", body, flags=re.S).strip()\n\n    if not cited:\n        cited = re.findall(r\"\\[([0-9]+|K[0-9]+)\\]\", body)\n\n    order = []\n    for c in cited:\n        if c not in order:\n            order.append(c)\n\n    rows = {}\n    for ln in (source_list or \"\").split(\"\\n\"):\n        ln = ln.strip()\n        if not ln:\n            continue\n        mm = re.match(r\"^(K?[0-9]+)\\.\\s\", ln)\n        if mm:\n            rows[mm.group(1)] = ln\n\n    # 先 K（内部资料）后网页，各自按编号顺序\n    picked_k = [c for c in order if c.startswith(\"K\") and c in rows]\n    picked_n = sorted(\n        [c for c in order if not c.startswith(\"K\") and c in rows], key=lambda x: int(x)\n    )\n    final = picked_k + picked_n\n\n    lines = [rows[c] for c in final]\n    cited_list = \"\\n\".join(lines) if lines else \"（正文没有引用任何来源）\"\n\n    return {\n        \"body\": body,\n        \"cited_list\": cited_list,\n        \"n_cited\": len(lines),\n        \"dropped\": max(0, len(rows) - len(lines)),\n    }\n"
        outputs:
          body:
            type: string
            children: null
          cited_list:
            type: string
            children: null
          n_cited:
            type: number
            children: null
          dropped:
            type: number
            children: null
