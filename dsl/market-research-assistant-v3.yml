    - data:
        desc: 切出要点并入知识库、取出下一轮检索式、判断是否提前收口
        selected: false
        title: ⑨ 拆解本轮结果
        type: code
        variables:
        - variable: analyze
          value_selector:
          - llm_analyze
          - text
        - variable: knowledge
          value_selector:
          - loop_learn
          - knowledge
        - variable: registry
          value_selector:
          - code_pack
          - registry
        - variable: new_count
          value_selector:
          - code_pack
          - new_count
        - variable: fallback
          value_selector:
          - sys
          - query
        code_language: python3
        code: "def main(analyze: str, knowledge: str, registry: str, new_count, fallback: str) -> dict:\n    text = (analyze or \"\").replace(\"\\r\", \"\")\n    lines = text.split(\"\\n\")\n\n    queries = []\n    keep = []\n    upper_all = text.upper()\n    for line in lines:\n        s = line.strip()\n        up = s.upper()\n        is_query_line = up.startswith(\"QUERY\") or up.startswith(\"检索式\")\n        if is_query_line:\n            val = s\n            for sep in (\"：\", \":\"):\n                if sep in s:\n                    val = s.split(sep, 1)[1].strip()\n                    break\n            val = val.strip(\" -•*[]()\\\"'\")\n            if len(val) >= 4 and val.upper() not in (\"QUERY1\", \"QUERY2\"):\n                queries.append(val)\n            continue\n        # 下一轮检索式这一节整体不进知识库\n        if s.startswith(\"【下一轮检索式】\"):\n            continue\n        keep.append(line)\n\n    body = \"\\n\".join(keep).strip()\n    body = body.replace(\"DONE\", \"\").strip() if \"DONE\" in upper_all and \"【\" not in body else body\n\n    prev = (knowledge or \"\").strip()\n    rounds = prev.count(\"=== 第\") + 1\n    chunk = \"=== 第 \" + str(rounds) + \" 轮 ===\\n\" + (body or \"（本轮无有效要点）\")\n    merged = (prev + \"\\n\\n\" + chunk).strip() if prev else chunk\n\n    # 停止条件：模型明确说够了，或者这轮一条新来源都没捞到（再去也是重复）\n    done = \"no\"\n    if \"DONE\" in upper_all:\n        done = \"yes\"\n    elif not queries:\n        done = \"yes\"\n    try:\n        if int(new_count or 0) == 0:\n            done = \"yes\"\n    except Exception:\n        pass\n\n    # 独立信号：写不出可信报告。注意两个前提，否则会把正常提问误判成跑偏：\n    #   · 只在「已经跑过至少一轮检索」后才判（首轮还没搜就先追问，不能算跑偏）\n    #   · 整个登记表一条来源都没有 → 确实没材料可写\n    #   · 模型自己明说材料无关/无法支撑（兜底）\n    total_rows = len([ln for ln in (registry or \"\").split(\"\\n\") if ln.strip()])\n    offtopic = \"no\"\n    if rounds >= 1 and total_rows == 0:\n        offtopic = \"yes\"\n    OFFTopic_MARKS = (\n        \"本轮材料与主题无关\", \"主题不明\", \"跑题\", \"无关内容\",\n        \"素材不含任何具体\", \"不含任何具体\", \"无具体行业\",\n        \"无法支撑\", \"无法形成结论\", \"没有可提炼\", \"缺乏具体\",\n        \"不具备交付条件\", \"缺少调研对象\",\n    )\n    if any(k in text for k in OFFTopic_MARKS):\n        offtopic = \"yes\"\n\n    uniq = []\n    for q in queries:\n        if q not in uniq:\n            uniq.append(q)\n    prefix = (fallback or \"该市场\").strip()[:30]\n    while len(uniq) < 2:\n        uniq.append(prefix + (\" 最新数据 增速\" if len(uniq) == 0 else \" 份额 排名 价格\"))\n\n    return {\n        \"knowledge\": merged,\n        \"registry\": registry or \"\",\n        \"q1\": uniq[0][:80],\n        \"q2\": uniq[1][:80],\n        \"done\": done,\n        \"offtopic\": offtopic,\n    }\n"
        outputs:
          knowledge:
            type: string
            children: null
          registry:
            type: string
            children: null
          q1:
            type: string
            children: null
          q2:
            type: string
            children: null
          done:
            type: string
            children: null
          offtopic:
            type: string
            children: null
        loop_id: loop_learn
        isInLoop: true
        isInIteration: false
      height: 98
