    - data:
        desc: 裁剪原始结果、按 URL 去重、给新来源分配全局编号 [n]
        selected: false
        title: ⑦ 去重 + 编号
        type: code
        variables:
        - variable: raw_a
          value_selector:
          - search_a
          - body
        - variable: raw_b
          value_selector:
          - search_b
          - body
        - variable: registry
          value_selector:
          - loop_learn
          - registry
        - variable: kb
          value_selector:
          - code_kb
          - kb_text
        - variable: kb_registry
          value_selector:
          - code_kb
          - kb_registry
        - variable: round_no
          value_selector:
          - code_pick
          - round
        code_language: python3
        code: "import json\nimport re\n\n\ndef _clean(text, limit):\n    text = re.sub(r\"\\s+\", \" \", (text or \"\")).strip()\n    # 登记表用 | 分隔，标题里的半角竖线必须替换掉，否则整行会错位\n    return text.replace(\"|\", \"｜\")[:limit]\n\n\ndef main(raw_a: str, raw_b: str, registry: str, kb: str, kb_registry: str, round_no: int) -> dict:\n    lines = [ln for ln in (registry or \"\").split(\"\\n\") if ln.strip()]\n\n    # 已知编号：url -> n；只有纯数字编号参与，K* 是知识库片段不参与网页编号\n    known = {}\n    maxn = 0\n    for ln in lines:\n        parts = [p.strip() for p in ln.split(\"|\")]\n        if len(parts) >= 3 and parts[0].isdigit():\n            known[parts[2]] = parts[0]\n            maxn = max(maxn, int(parts[0]))\n\n    out = []\n    added = 0\n\n    # 知识库片段只在第 1 轮注入，编号 K1..Kn，与网页来源 [n] 分开\n    if str(round_no) == \"1\" and (kb or \"\").strip():\n        out.append(\"===== 内部知识库（历史报告） =====\")\n        out.append(kb.strip())\n        for ln in (kb_registry or \"\").split(\"\\n\"):\n            if ln.strip():\n                lines.append(ln.strip())\n                added += 1\n\n    for tag, raw in ((\"A\", raw_a), (\"B\", raw_b)):\n        try:\n            data = json.loads(raw or \"{}\")\n        except Exception:\n            data = {}\n        if not isinstance(data, dict):\n            data = {}\n\n        answer = _clean(data.get(\"answer\"), 700)\n        if answer:\n            # 引擎摘要也要有个正式编号，否则模型会自己编「[搜索B]」这种\n            # 没法在来源表里对应上的标注（本次踩过）。\n            key = \"answer://\" + tag\n            if key in known:\n                snum = known[key]\n            else:\n                maxn += 1\n                snum = str(maxn)\n                known[key] = snum\n                added += 1\n                lines.append(snum + \" | Tavily 引擎摘要（检索式\" + tag + \"） | Tavily answer 字段 | \")\n            out.append(\"[\" + snum + \"] Tavily 引擎摘要（检索式\" + tag + \"）\\n\" + answer)\n\n        results = data.get(\"results\") or []\n        if not isinstance(results, list):\n            results = []\n        for item in results[:6]:\n            if not isinstance(item, dict):\n                continue\n            url = (item.get(\"url\") or \"\").strip()\n            if not url:\n                continue\n            title = _clean(item.get(\"title\"), 100)\n            date = _clean(item.get(\"published_date\"), 10)\n            body = _clean(item.get(\"content\"), 900)\n\n            if url in known:\n                num = known[url]\n            else:\n                maxn += 1\n                num = str(maxn)\n                known[url] = num\n                added += 1\n                lines.append(num + \" | \" + (title or \"未命名来源\") + \" | \" + url + \" | \" + date)\n\n            out.append(\"[\" + num + \"] \" + title + \" (\" + date + \")\\n\" + body)\n\n    numbered = \"\\n\\n\".join(out) if out else \"（本轮检索没有返回任何结果）\"\n    return {\n        \"numbered\": numbered,\n        \"registry\": \"\\n\".join(lines),\n        \"new_count\": added,\n        \"total_count\": len(lines),\n    }\n"
        outputs:
          numbered:
            type: string
            children: null
          registry:
            type: string
            children: null
          new_count:
            type: number
            children: null
          total_count:
            type: number
            children: null
        loop_id: loop_learn
        isInLoop: true
        isInIteration: false
