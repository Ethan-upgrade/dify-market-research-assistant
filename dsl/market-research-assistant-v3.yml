    - data:
        desc: 把知识库召回结果整理成 [K1] 编号片段 + 登记表行；与主题无关的片段直接丢掉
        selected: false
        title: 整理历史报告片段
        type: code
        variables:
        - variable: chunks
          value_selector:
          - kb_search
          - result
        - variable: topic
          value_selector:
          - code_brief
          - text
        - variable: query
          value_selector:
          - sys
          - query
        code_language: python3
        code: "import re\n\n\ndef _terms(text):\n    \"\"\"抽相关性判断词：中文取 3~6 字连续片段（够长才有区分度），英文/数字词整体保留。\"\"\"\n    blob = re.sub(r\"[^\\u4e00-\\u9fffA-Za-z0-9]+\", \" \", text or \"\")\n    out = set()\n    for w in blob.split():\n        if not w:\n            continue\n        if re.fullmatch(r\"[A-Za-z0-9\\-]{3,}\", w):\n            out.add(w.lower())\n            continue\n        # 3 字滑窗：既有区分度，又不会因为断句位置不同而漏掉\n        for size in (3, 4):\n            if len(w) >= size:\n                for i in range(len(w) - size + 1):\n                    out.add(w[i:i + size])\n    return out\n\n\nSTOP = {\n    \"市场规模\", \"市场规\", \"场规模\", \"竞争格局\", \"竞争格\", \"争格局\", \"增长趋势\", \"增长趋\", \"长趋势\",\n    \"调研\", \"研究\", \"报告\", \"分析\", \"情况\", \"趋势\", \"格局\", \"规模\", \"市场\", \"行业\", \"数据\",\n    \"全球\", \"国内\", \"中国\", \"我们\", \"用于\", \"需要\", \"帮我\", \"一下\", \"哪些\", \"怎么\",\n}\n\n\ndef _terms_filtered(text):\n    return {t for t in _terms(text) if t not in STOP}\n\n\ndef main(chunks, topic: str, query: str) -> dict:\n    items = chunks\n    if isinstance(items, str):\n        try:\n            import json\n            items = json.loads(items)\n        except Exception:\n            items = []\n    if not isinstance(items, list):\n        items = []\n\n    # 主题只取「调研主题 / 所属行业」两行 + 用户原话；核心问题里的通用词不算\n    topic_head = \"\"\n    for line in (topic or \"\").split(\"\\n\"):\n        s = line.strip()\n        for prefix in (\"调研主题：\", \"所属行业：\", \"目标市场：\"):\n            if s.startswith(prefix):\n                topic_head += \" \" + s.split(\"：\", 1)[1]\n    terms = _terms_filtered(topic_head + \" \" + (query or \"\"))\n    gate = len(terms) >= 3\n\n    out, reg, seen = [], [], set()\n    seen_title = {}\n    n = 0\n    dropped = 0\n    for c in items:\n        if not isinstance(c, dict):\n            continue\n        content = (c.get(\"content\") or \"\").strip()\n        title = (c.get(\"title\") or \"历史报告\").strip().replace(\"|\", \"｜\")\n        if not content:\n            continue\n        key = title + \"|\" + content[:40]\n        if key in seen:\n            continue\n        seen.add(key)\n\n        # 相关性门控：标题或正文里至少命中一个主题词，否则视为无关历史报告，直接丢掉\n        if gate:\n            hay = (title + \"\\n\" + content).lower()\n            if not any(t in hay for t in terms):\n                dropped += 1\n                continue\n\n        n += 1\n        tag = \"K\" + str(n)\n        seen_title[title] = seen_title.get(title, 0) + 1\n        label = title if seen_title[title] == 1 else title + \"（片段\" + str(seen_title[title]) + \"）\"\n        out.append(\"[\" + tag + \"] 《\" + label + \"》\\n\" + content[:900])\n        reg.append(tag + \" | \" + label[:60] + \" | 内部知识库 | \")\n\n    return {\n        \"kb_text\": \"\\n\\n\".join(out)[:5000],\n        \"kb_registry\": \"\\n\".join(reg),\n        \"kb_count\": n,\n        \"kb_dropped\": dropped,\n    }\n"
        outputs:
          kb_text:
            type: string
            children: null
          kb_registry:
            type: string
            children: null
          kb_count:
            type: number
            children: null
          kb_dropped:
            type: number
            children: null
      height: 98
      id: code_kb
