        desc: 把全部轮次的要点与编号来源整理成写作素材
        selected: false
        title: ⑪ 汇总材料与来源表
        type: code
        variables:
        - variable: knowledge
          value_selector:
          - loop_learn
          - knowledge
        - variable: registry
          value_selector:
          - loop_learn
          - registry
        code_language: python3
        code: "import re\n\n\ndef main(knowledge: str, registry: str) -> dict:\n    materials = (knowledge or \"\").strip()\n    if not materials:\n        materials = \"（本次联网检索没有返回任何材料：请确认环境变量 TAVILY_API_KEY 有效，且容器可访问 api.tavily.com）\"\n\n    rows = [ln for ln in (registry or \"\").split(\"\\n\") if ln.strip()]\n    lines = []\n    kb_lines = []\n    all_nums = []\n    all_k = []\n    for ln in rows:\n        parts = [p.strip() for p in ln.split(\"|\")]\n        num = parts[0] if parts else \"\"\n        title = parts[1] if len(parts) > 1 else \"\"\n        url = parts[2] if len(parts) > 2 else \"\"\n        date = parts[3] if len(parts) > 3 else \"\"\n        if not num:\n            continue\n        when = \"（\" + date + \"）\" if date else \"\"\n        tail = \" — \" + url if url else \"\"\n        entry = num + \". \" + (title or \"未命名来源\") + when + tail\n        if num.startswith(\"K\"):\n            kb_lines.append(entry)\n            all_k.append(num)\n        else:\n            lines.append(entry)\n            all_nums.append(num)\n\n    source_list = \"\\n\".join(kb_lines + lines) if (kb_lines or lines) else \"（本次没有取得可用来源）\"\n\n    # 告诉写作节点：哪些编号还没被用过，逼它覆盖，避免「列了 31 条只用 21 条」\n    cited = set(re.findall(r\"\\[([0-9]+|K[0-9]+)\\]\", materials))\n    unused_web = [n for n in all_nums if n not in cited]\n    unused_kb = [k for k in all_k if k not in cited]\n    unused = \"、\".join(\"[\" + x + \"]\" for x in (unused_kb + unused_web))\n    if not unused:\n        unused = \"无（所有来源都已被引用）\"\n\n    return {\n        \"materials\": materials,\n        \"source_list\": source_list,\n        \"n_sources\": len(lines) + len(kb_lines),\n        \"n_kb\": len(kb_lines),\n        \"unused\": unused,\n    }\n"
        outputs:
          materials:
            type: string
            children: null
          source_list:
            type: string
            children: null
          n_sources:
            type: number
            children: null
          n_kb:
            type: number
            children: null
          unused:
            type: string
            children: null
