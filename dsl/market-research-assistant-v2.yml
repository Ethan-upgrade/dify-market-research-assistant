    opening_statement: '👋 我是市场调研报告助手。


      请用一句话告诉我你要调研什么，例如：

      「帮我看看国内新能源汽车充电桩市场的竞争格局和机会点」


      我的工作流程是：

      1. 先和你确认「调研对象、目标市场、目标客群、调研目的」这几个关键信息；

      2. 再联网检索公开资料（行业报告、财报、新闻、政策）；

      3. 最后按「执行摘要 / 市场规模 / 竞争格局 / 用户洞察 / 趋势 / 风险 / 建议」七个章节输出报告。

      '
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 帮我调研国内新能源汽车充电桩市场
    - 分析一下中国扫地机器人市场的竞争格局
    - 我想进入东南亚跨境电商，先做一份市场进入调研
