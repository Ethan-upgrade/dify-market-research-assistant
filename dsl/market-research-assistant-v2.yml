    - data:
        desc: 把三份原始结果压缩成带来源的要点，并指出还缺什么
        selected: false
        title: ⑦ 要点提炼 + 缺口识别
        type: llm
        model:
          provider: ''
          name: ''
          mode: chat
          completion_params:
            temperature: 0.3
            max_tokens: 8192
        prompt_template:
        - role: system
          text: '你是资深市场研究分析师。下面给你三组联网检索的原始 JSON 结果，请完成两件事。


            ## 任务一：提炼材料要点

            - 输出 8~14 条要点，每条一句话，控制在 60 字以内

            - 必须保留具体数字、比例、年份、公司名；没有数字的结论要写「（无数据）」

            - 每条结尾用括号标注来源，格式：（来源：机构或媒体名，年份）

            - 如果几份材料互相矛盾，单独用一条要点把矛盾写出来

            - 如果材料与调研主题明显不相关，必须第一句就指出来


            ## 任务二：识别缺口

            - 指出为了写好这份报告，材料里仍然缺失的关键信息（最多 3 条）

            - 针对这些缺口，写 2 条补充检索式


            ## 输出格式（严格遵守，不要加别的段落）

            【材料要点】

            - 要点1（来源：xx，2024）

            - 要点2（来源：yy，2025）

            【缺口】

            - 缺口1

            - 缺口2

            【补充检索】

            QUERY1: <检索式>

            QUERY2: <检索式>


            ## 约束

            - 简体中文

            - 只依据给你的材料，不要补充你自己的行业知识

            - QUERY1 / QUERY2 后面必须是能直接丢进搜索引擎的短句，不要解释'
        - role: user
          text: '调研简报：

            {{#llm_brief.text#}}


            === 材料 A ===

            {{#search_1.body#}}


            === 材料 B ===

            {{#search_2.body#}}


            === 材料 C ===

