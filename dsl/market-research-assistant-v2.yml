    - data:
        desc: 从反思结果里取出 2 条补充检索式；缺失时按主题兜底
        selected: false
        title: ⑧ 拆分补充检索式
        type: code
        variables:
        - variable: reflect
          value_selector:
          - llm_reflect
          - text
        - variable: fallback
          value_selector:
          - sys
          - query
        code_language: python3
        code: "def main(reflect: str, fallback: str) -> dict:\n    raw = (reflect or \"\").replace(\"\\r\", \"\")\n    found = []\n    for line in raw.split(\"\\n\"):\n        s = line.strip()\n        up = s.upper()\n        if up.startswith(\"QUERY\") or up.startswith(\"补充检索\"):\n            for sep in (\"：\", \":\"):\n                if sep in s:\n                    s = s.split(sep, 1)[1].strip()\n                    break\n            s = s.strip(\" -•*[]()\")\n            if len(s) >= 4 and s.upper() not in (\"QUERY1\", \"QUERY2\"):\n                found.append(s)\n\n    uniq = []\n    for s in found:\n        if s not in uniq:\n            uniq.append(s)\n\n    if len(uniq) < 2:\n        base = (fallback or \"该市场\").strip()[:40]\n        for s in [base + \" 最新 数据 增速\", base + \" 份额 排名 价格\"]:\n            if len(uniq) >= 2:\n                break\n            if s not in uniq:\n                uniq.append(s)\n\n    while len(uniq) < 2:\n        uniq.append(uniq[-1] if uniq else \"\")\n\n    return {\"q1\": uniq[0], \"q2\": uniq[1]}\n"
        outputs:
          q1:
            type: string
            children: null
          q2:
            type: string
            children: null
