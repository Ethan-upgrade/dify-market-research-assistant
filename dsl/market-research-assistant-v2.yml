    - data:
        desc: 把 3 行文本拆成三条独立变量；规划失败时按简报自动兜底
        selected: false
        title: ③ 拆分检索式
        type: code
        variables:
        - variable: plan
          value_selector:
          - llm_plan
          - text
        - variable: brief
          value_selector:
          - llm_brief
          - text
        - variable: fallback
          value_selector:
          - sys
          - query
        code_language: python3
        code: "def main(plan: str, brief: str, fallback: str) -> dict:\n    raw = (plan or \"\").replace(\"\\r\", \"\")\n    lines = []\n    for line in raw.split(\"\\n\"):\n        s = line.strip().strip(\"-*0123456789.、 []()\").strip()\n        if len(s) < 4:\n            continue\n        for sep in (\"：\", \":\"):\n            if s.startswith(\"检索式\") and sep in s:\n                s = s.split(sep, 1)[1].strip()\n        lines.append(s)\n\n    uniq = []\n    for s in lines:\n        if s and s not in uniq:\n            uniq.append(s)\n\n    # 规划节点没吐出有效内容时，用简报里的行业与市场拼出三条差异化检索式。\n    # 绝不能退化成三条一模一样的查询，否则三份材料全是重复内容。\n    if len(uniq) < 3:\n        base = []\n        for line in (brief or \"\").splitlines():\n            s = line.strip()\n            if s.startswith(\"所属行业：\"):\n                base.append(s.split(\"：\", 1)[1].strip())\n            elif s.startswith(\"目标市场：\"):\n                base.append(s.split(\"：\", 1)[1].strip())\n        prefix = \" \".join(base).strip() or (fallback or \"市场调研\")\n        dims = [\"市场规模 增长率 行业数据\", \"竞争格局 市场份额 主要厂商\", \"价格 渠道 政策 用户需求\"]\n        uniq = [((prefix + \" \" + d)[:60]) for d in dims]\n\n    while len(uniq) < 3:\n        uniq.append(uniq[-1])\n\n    return {\"q1\": uniq[0], \"q2\": uniq[1], \"q3\": uniq[2]}\n"
        outputs:
          q1:
            type: string
            children: null
          q2:
            type: string
            children: null
          q3:
            type: string
            children: null
      height: 98
      id: code_split
      position:
        x: 900
        y: 60
      positionAbsolute:
        x: 900
        y: 60
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
