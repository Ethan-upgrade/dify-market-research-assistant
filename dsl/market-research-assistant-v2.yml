    - data:
        desc: 按简报拆出 3 条互补检索式：规模 / 格局 / 价格与政策
        selected: false
        title: ② 检索式规划
        type: llm
        model:
          provider: ''
          name: ''
          mode: chat
          completion_params:
            temperature: 0.4
            max_tokens: 4096
        prompt_template:
        - role: system
          text: '你是资深市场研究分析师。根据调研简报，设计 3 条互补的联网检索式。


            ## 要求

            - 三条检索式分别覆盖：① 市场规模与增速 ② 竞争格局与份额 ③ 价格、渠道、政策或用户需求

            - 必须带上「地区 + 行业词 + 维度关键词 + 年份」，例如：中国 充电桩 市场规模 增长率 2024

            - 每条 8~30 个字，不要问句，不要引号，不要编号，不要解释，不要 Markdown

            - 三条之间不要重复用词


            ## 输出

            只输出 3 行，每行一条检索式，不要有任何前后缀。'
        - role: user
          text: '调研简报：

            {{#llm_brief.text#}}'
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 10
        context:
          enabled: false
